<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ApplyWise Options</title>
  <link rel="stylesheet" href="options.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
      </svg>
      <span>ApplyWise Settings</span>
    </div>

    <section class="settings-section">
      <h2>Backend URL</h2>
      <p class="description">Override the backend URL only if self-hosting. Leave blank to use the production API.</p>
      <div class="field-row">
        <input
          type="url"
          id="api-url-input"
          placeholder="https://applywise-q8d2.onrender.com/api"
          class="text-input"
        />
        <button id="save-api-btn" class="btn btn-primary">Save</button>
      </div>
      <p id="api-save-status" class="save-status"></p>
    </section>

    <section class="settings-section">
      <h2>Dashboard</h2>
      <p class="description">Manage quick links and other settings from the ApplyWise dashboard.</p>
      <a id="dashboard-link" href="#" target="_blank" class="btn btn-secondary">Open Dashboard</a>
    </section>
  </div>
  <script src="../config.js"></script>
  <script src="options.js"></script>
</body>
</html>
